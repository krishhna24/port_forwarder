[package]
name = "rust-tcp-forwarder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, protocol-agnostic TCP port forwarder built on blocking std::net I/O"
license = "MIT"
readme = "README.md"
keywords = ["tcp", "proxy", "port-forwarding", "networking"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "tcp-forwarder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
